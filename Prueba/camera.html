<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Módulo de cámara industrial para clasificación de mercancía por QR">
    <title>Cámara QR | Clasificador Industrial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/camera.css">
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="scan-canvas"></canvas>

<div id="ui-overlay">

    <div class="top-bar">
        <a href="index.html" class="back-btn" title="Volver al dashboard">
            <span>←</span>
        </a>
        <div class="top-title">
            <span class="top-label">CLASIFICADOR QR</span>
            <span class="top-sub" id="resolution-label">Iniciando...</span>
        </div>
        <div class="top-right">
            <div class="ssl-badge" id="ssl-badge">
                <span class="ssl-dot" id="ssl-dot"></span>
                <span id="ssl-text">HTTPS</span>
            </div>
        </div>
    </div>

    <div class="scanner-area" id="scanner-area">

        <div class="scan-frame" id="scan-frame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="scan-line" id="scan-line"></div>
        </div>

        <div class="cam-placeholder" id="cam-placeholder">
            <div class="cam-placeholder-icon">📷</div>
            <p class="cam-placeholder-title">Módulo de Cámara</p>
            <p class="cam-placeholder-sub">
                Se necesita HTTPS para acceder a la cámara.<br>
                Toca <strong>Activar</strong> para comenzar.
            </p>
            <div class="ssl-info-box" id="ssl-info-box">
                <span class="ssl-lock">🔒</span>
                <span id="ssl-info-text">Verificando HTTPS...</span>
            </div>
        </div>

        <div class="qr-detected-popup" id="qr-popup">
            <div class="qr-popup-icon">✓</div>
            <div class="qr-popup-data" id="qr-popup-data">QR: --</div>
            <div class="qr-popup-cat"  id="qr-popup-cat">Categoría Detectada</div>
        </div>
    </div>

    <div class="bottom-panel">

        <div class="metrics-row">
            <div class="metric-item" id="metric-fps">
                <span class="metric-val mono" id="fps-val">--</span>
                <span class="metric-lbl">FPS</span>
            </div>
            <div class="metric-sep"></div>
            <div class="metric-item">
                <span class="metric-val mono" id="res-val">--</span>
                <span class="metric-lbl">RESOLUCIÓN</span>
            </div>
            <div class="metric-sep"></div>
            <div class="metric-item">
                <span class="metric-val mono" id="sent-val">0</span>
                <span class="metric-lbl">ENVIADOS</span>
            </div>
            <div class="metric-sep"></div>
            <div class="metric-item">
                <span class="metric-val mono" id="server-val">--</span>
                <span class="metric-lbl">SERVIDOR</span>
            </div>
        </div>

        <div class="last-qr-row" id="last-qr-row" style="display:none">
            <span class="last-qr-label">Último QR:</span>
            <span class="last-qr-val mono" id="last-qr-val">—</span>
            <span class="last-qr-cat"  id="last-qr-cat">—</span>
        </div>

        <div class="controls-row">
            <button class="ctrl-btn ctrl-flip" id="btn-flip" onclick="flipCamera()" style="display:none" title="Cambiar cámara">
                🔄
            </button>

            <button class="ctrl-btn-main" id="btn-main" onclick="toggleCamera()">
                <span id="btn-main-icon">▶</span>
                <span id="btn-main-text">Activar Cámara</span>
            </button>

            <div class="auto-toggle-wrap">
                <span class="auto-label">Auto</span>
                <label class="toggle-sw">
                    <input type="checkbox" id="auto-send" checked>
                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>
                </label>
            </div>
        </div>

        <div class="server-status-row">
            <div class="server-status" id="server-status-bar">
                <span class="server-dot" id="server-dot"></span>
                <span id="server-status-text">Verificando conexión con el Servidor API...</span>
            </div>
        </div>

    </div></div><div class="toast-wrap" id="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="js/camera.js"></script>
</body>
</html>
